#cloud-config
# First-boot setup for the Azure VM (passed by cloud/scripts/azure_create_vm.sh).
# Installs Docker and git, and adds swap: a B1s VM has only 1 GB of RAM, and
# building the images plus running Postgres, the broker, the classifier and
# the API needs some headroom. No secrets here; azure_deploy.sh copies .env
# over SSH.

package_update: true
packages:
  - ca-certificates
  - curl
  - git
  - python3-venv # for cloud/scripts/smoke_test.sh

swap:
  filename: /swapfile
  size: 2G

runcmd:
  - curl -fsSL https://get.docker.com | sh
  - usermod -aG docker azureuser
  - systemctl enable --now docker
