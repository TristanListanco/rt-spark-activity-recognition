# Mosquitto broker for the activity-recognition stack.
# The password file is generated at startup by entrypoint.sh from cloud/.env.

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp_format %Y-%m-%dT%H:%M:%S
