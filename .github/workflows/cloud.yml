name: Cloud

# Tests the Flask API and classifier services, then builds the Docker Compose
# stack and (once cloud/scripts/smoke_test.sh exists) runs an end-to-end check
# with the fake publisher. Jobs skip until the matching files exist.

on:
  push:
    branches: [main]
    paths:
      - "cloud/**"
      - "ml/activity_ml/**"
      - "ml/models/**"
      - "tools/**"
      - ".github/workflows/cloud.yml"
  pull_request:
    paths:
      - "cloud/**"
      - "ml/activity_ml/**"
      - "ml/models/**"
      - "tools/**"
      - ".github/workflows/cloud.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.find.outputs.services }}
      compose: ${{ steps.find.outputs.compose }}
    steps:
      - uses: actions/checkout@v7
      - id: find
        run: |
          services=""
          for svc in api classifier; do
            if [ -f "cloud/$svc/requirements.txt" ]; then
              services="${services:+$services,}\"$svc\""
            fi
          done
          echo "services=[$services]" >> "$GITHUB_OUTPUT"

          if [ -f cloud/docker-compose.yml ]; then compose=true; else compose=false; fi
          echo "compose=$compose" >> "$GITHUB_OUTPUT"

          if [ -z "$services" ] && [ "$compose" = false ]; then
            echo "::notice::No cloud services yet; skipping cloud CI."
          fi

  test:
    name: Test ${{ matrix.service }}
    needs: detect
    if: needs.detect.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.services) }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: activity_test
          POSTGRES_USER: activity
          POSTGRES_PASSWORD: activity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U activity -d activity_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SERVICE: ${{ matrix.service }}
      # Tests that need a database read this; the classifier imports ml/activity_ml.
      DATABASE_URL: postgresql://activity:activity@localhost:5432/activity_test
      PYTHONPATH: ${{ github.workspace }}/ml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud/${{ matrix.service }}/requirements.txt
      - name: Install dependencies
        run: pip install -r "cloud/$SERVICE/requirements.txt" pytest
      - name: Run tests
        run: |
          if [ -d "cloud/$SERVICE/tests" ]; then
            pytest -q "cloud/$SERVICE/tests"
          else
            echo "::notice::cloud/$SERVICE has no tests yet."
          fi

  compose:
    name: Compose build and smoke test
    needs: detect
    if: needs.detect.outputs.compose == 'true'
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: cloud/docker-compose.yml
    steps:
      - uses: actions/checkout@v7
      - name: Create .env from template
        run: cp cloud/.env.example cloud/.env
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build
      - name: End-to-end smoke test
        if: hashFiles('cloud/scripts/smoke_test.sh') != ''
        run: bash cloud/scripts/smoke_test.sh
      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
