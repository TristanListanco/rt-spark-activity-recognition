name: Firmware

# Host-side check that the firmware's JSON messages pass the cloud's validator,
# then a full build of the RT-Spark image with firmware/build.sh (pinned
# RT-Thread + this project's applications/ and configuration). Real Wi-Fi/MQTT
# credentials never reach CI: build.sh falls back to secrets.example.h.

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "cloud/classifier/payload.py"
      - "cloud/classifier/pipeline.py"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - "cloud/classifier/payload.py"
      - "cloud/classifier/pipeline.py"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect project
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.find.outputs.present }}
    steps:
      - uses: actions/checkout@v7
      - id: find
        run: |
          if [ -f firmware/build.sh ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::firmware/ has no build.sh yet; skipping firmware CI."
          fi

  host-tests:
    name: Message format (host)
    needs: detect
    if: needs.detect.outputs.present == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r cloud/classifier/requirements.txt pytest
      - run: pytest -q firmware/tests

  build:
    name: Build image
    needs: detect
    if: needs.detect.outputs.present == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Arm GNU toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi
          arm-none-eabi-gcc --version | head -1
      - name: Cache RT-Thread, Env and packages
        uses: actions/cache@v6
        with:
          path: |
            firmware/.rtt
            ~/.env
          key: rtt-${{ hashFiles('firmware/build.sh', 'firmware/.config') }}
          restore-keys: rtt-
      - name: Build
        env:
          RTT_EXEC_PATH: /usr/bin
        run: firmware/build.sh build
      - name: Size report
        run: |
          {
            echo '### Firmware size'
            echo '```'
            arm-none-eabi-size firmware/out/rt-thread.elf
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: rtthread-firmware
          path: firmware/out/
          retention-days: 14
